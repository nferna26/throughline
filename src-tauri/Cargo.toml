[package]
name = "throughline"
version = "0.9.3"
description = "Throughline — local-first macOS reading app for serious readers"
authors = ["Nick Fernandez"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nferna26/throughline"
readme = "../README.md"
keywords = ["reading", "epub", "local-first", "tauri", "macos"]
categories = ["text-processing"]
default-run = "throughline"

[lib]
name = "throughline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Reader-initiated auto-update (click → download → relaunch). Only checks when the
# user asks (a Settings button), never on launch or a timer — within the
# no-background-network posture. NOT tauri-plugin-http/shell (which stay banned).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Company-mode activation deep link (throughline://activate?token=…). Reader-
# initiated (they click the post-purchase link); single-instance focuses the
# running app instead of spawning a second one.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Opens the public download page in the READER'S BROWSER (never in the webview)
# when the in-app updater cannot finish (CORE-1192). window.open is a no-op in
# wry, so this is the only working path out. Not an HTTP surface: it hands a URL
# to macOS and the capability scopes it to https://readthroughline.com/* only.
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
thiserror = "1"
epub = "2.1"
zip = "2"
# Lossy transcoding of non-UTF-8 .txt imports (Windows-1252, UTF-16) to UTF-8 for
# the derived reader text (CORE-1156 #11); the immutable source keeps raw bytes.
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
futures-util = "0.3"
url = "2"
# Secure at-rest storage for cloud-provider API keys (macOS Keychain via the
# Security framework). Keys are NEVER written to the DB, a file, the repo, or any
# export; only `key_present` booleans ever reach the frontend.
keyring = { version = "3", features = ["apple-native"] }
# Decode the Codex id_token JWT payload (for chatgpt_account_id) during device login.
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow"] }

[dev-dependencies]
# Property-based testing for the TXT sectionizer invariants (coverage, no
# overlap/gaps, char-boundary locators, no degenerate sections). Test-only —
# never compiled into the shipped app.
proptest = "1"
# REL-008: the release pipeline's REFERENCE updater-signature verifier
# (examples/verify_minisign.rs) uses the EXACT crate tauri-plugin-updater
# verifies with — already in the lockfile transitively at this same version, so
# this pins no new code, only makes it nameable from an example. Test-only.
minisign-verify = "0.2.5"

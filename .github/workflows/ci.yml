name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Throughline hard-codes macOS data paths (~/Library/Application Support),
    # so CI runs on macOS only. See README "Platform support".
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Version consistency (tauri.conf / package.json / Cargo.toml)
        run: npm run version:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium

      # Required gate, not optional: this suite drives the REAL frontend (vite
      # dev + faked IPC) and is the only automated coverage of reader-visible
      # flows — it caught the locator-dialect silent no-op every other suite
      # slept through.
      - name: UI walkthrough + a11y (Playwright)
        run: npx playwright test

      - name: Rust tests (lib + integration)
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Golden loop (offline acceptance, isolated data dir)
        working-directory: src-tauri
        run: cargo run --example stage2_golden_loop

      - name: Rust lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust build (production binary)
        working-directory: src-tauri
        run: cargo build --bin throughline

      - name: Dependency audit (advisory, non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

  plain-language-gate:
    # CORE-1169: the plain-language eval harness (Python) is a REQUIRED gate, not just
    # documentation. It runs the harness unit suite AND re-verifies the combined-gate
    # result over COMMITTED fixtures (the recorded 960-cell run + content-hashed judge
    # verdicts) with NO model calls and NO lexicon dependency (the deterministic lexical
    # scores are committed in the fixture). So "GREEN" reproduces from a named revision.
    # Pure Python, no macOS dependency -> ubuntu is fine and fast.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval/plain-language
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        # The harness runs fully without the license-bound AoA lexicon (it is optional and
        # gitignored); the committed fixtures already carry the lexical scores, so the gate
        # verification needs neither the lexicon nor any model.
        run: pip install -r requirements.txt pytest

      - name: Plain-language harness tests
        run: python -m pytest tests/ -q

      - name: Verify combined gate reproduces from committed fixtures (no model)
        run: python verify_gate.py

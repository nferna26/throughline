name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Throughline hard-codes macOS data paths (~/Library/Application Support),
    # so CI runs on macOS only. See README "Platform support".
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable branch, reviewed pin
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Version consistency (tauri.conf / package.json / Cargo.toml)
        run: npm run version:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium

      # Required gate, not optional: this suite drives the REAL frontend (vite
      # dev + faked IPC) and is the only automated coverage of reader-visible
      # flows — it caught the locator-dialect silent no-op every other suite
      # slept through.
      - name: UI walkthrough + a11y (Playwright)
        run: npx playwright test

      - name: Rust tests (lib + integration)
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Golden loop (offline acceptance, isolated data dir)
        working-directory: src-tauri
        run: cargo run --example stage2_golden_loop

      - name: Rust lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust build (debug compile check — the SHIPPED binary is built, signed, and verified by release.yml)
        working-directory: src-tauri
        run: cargo build --bin throughline

      # ── Dependency audits ────────────────────────────────────────────────
      # A suite outside a gate is documentation, not protection (CLAUDE.md) —
      # so the audits that matter BLOCK. Production deps ship inside the app:
      # any advisory, at any severity, is a red build. The release toolchain
      # (wrangler, @tauri-apps/cli) runs with publication credentials, so its
      # subtrees block too (scripts/audit-release-tool.mjs). Only the residual
      # dev-only tree (vite/vitest/etc. never shipped, never credentialed)
      # stays advisory. The Rust half of this gate is the rust-advisories job.
      - name: Production dependency audit (BLOCKING — these packages ship in the app)
        run: npm audit --omit=dev --audit-level=low

      - name: Release-tool dependency audit (BLOCKING — wrangler + @tauri-apps/cli subtrees)
        run: node scripts/audit-release-tool.mjs

      - name: Dev-only dependency audit (advisory, non-blocking — dev tree outside the gates above)
        run: npm audit --audit-level=high
        continue-on-error: true

  rust-advisories:
    # RustSec advisory gate over src-tauri/Cargo.lock — a REQUIRED gate, not
    # advice. `cargo audit` fails on any known VULNERABILITY; --deny elevates
    # `unsound` and `yanked` to failures too. The ONLY exceptions live in
    # src-tauri/.cargo/audit.toml, each documented with its reason + revisit
    # condition (currently one: RUSTSEC-2024-0429, glib — Linux-only subtree
    # of Tauri 2's GTK3 stack, compiled into no macOS artifact). Plain
    # `unmaintained` advisories stay visible warnings. Lockfile-only → ubuntu
    # is fine and fast; the binary is release-built musl, pinned by sha256
    # (no mutable tag, no compile step, and — per this repo's supply-chain
    # rule — nothing executable fetched without a reviewed pin).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cargo-audit (prebuilt, checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz --strip-components=1
          ./cargo-audit --version

      - name: Rust advisory audit (BLOCKING — vulnerabilities, unsound, yanked)
        working-directory: src-tauri
        run: ../cargo-audit audit --deny unsound --deny yanked

  plain-language-gate:
    # CORE-1169: the plain-language eval harness (Python) is a REQUIRED gate, not just
    # documentation. It runs the harness unit suite AND re-verifies the combined-gate
    # result over COMMITTED fixtures (the recorded 960-cell run + content-hashed judge
    # verdicts) with NO model calls and NO lexicon dependency (the deterministic lexical
    # scores are committed in the fixture). So "GREEN" reproduces from a named revision.
    # Pure Python, no macOS dependency -> ubuntu is fine and fast.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval/plain-language
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install eval dependencies
        # The harness runs fully without the license-bound AoA lexicon (it is optional and
        # gitignored); the committed fixtures already carry the lexical scores, so the gate
        # verification needs neither the lexicon nor any model.
        run: pip install -r requirements.txt pytest

      - name: Plain-language harness tests
        run: python -m pytest tests/ -q

      - name: Verify combined gate reproduces from committed fixtures (no model)
        run: python verify_gate.py
